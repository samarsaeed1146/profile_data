<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Card</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
    <div
      class="w-80 bg-white border border-slate-200 rounded-2xl p-6 text-center"
    >
      <div
        class="w-20 h-20 rounded-full bg-indigo-500 text-white text-2xl font-medium flex items-center justify-center mx-auto mb-4"
      >
        SS
      </div>

      <h1 class="text-xl font-medium text-slate-900">Samar Saeed</h1>
      <p class="text-sm text-slate-500">@samar.dev</p>

      <p class="mt-3 text-sm text-slate-600 leading-relaxed">
        Full-stack web developer building clean, modern interfaces and web
        applications.
      </p>

      <div class="grid grid-cols-3 my-5 py-4 border-y border-slate-200">
        <div>
          <p class="text-lg font-medium text-slate-900">123</p>
          <p class="text-xs text-slate-500">Posts</p>
        </div>
        <div>
          <p class="text-lg font-medium text-slate-900" id="follow">1,250</p>
          <p class="text-xs text-slate-500">Followers</p>
        </div>
        <div>
          <p class="text-lg font-medium text-slate-900">120</p>
          <p class="text-xs text-slate-500">Following</p>
        </div>
      </div>

      <button
        class="w-full py-2.5 rounded-lg text-sm font-medium border transition-colors duration-300"
        id="followButton"
      >
        Follow
      </button>
    </div>

    <script>
      let isFollowing = false;
      let followers = 1250;

      const followButton = document.getElementById("followButton");
      const followCount = document.getElementById("follow");
      function render() {
        if (isFollowing) {
          followButton.textContent = "Following";

          followButton.classList.remove(
            "bg-indigo-600",
            "text-white",
            "border-indigo-600",
            "hover:bg-indigo-700",
          );
          followButton.classList.add(
            "bg-white",
            "text-slate-700",
            "border-slate-300",
            "hover:bg-slate-50",
          );
        } else {
          followButton.textContent = "Follow";

          followButton.classList.remove(
            "bg-white",
            "text-slate-700",
            "border-slate-300",
            "hover:bg-slate-50",
          );
          followButton.classList.add(
            "bg-indigo-600",
            "text-white",
            "border-indigo-600",
            "hover:bg-indigo-700",
          );
        }

        followCount.textContent = followers.toLocaleString();
      }

      function toggleFollow() {
        isFollowing = !isFollowing;

        if (isFollowing) {
          followers++;
        } else {
          followers--;
        }

        render();
      }

      followButton.addEventListener("click", toggleFollow);

      render();
    </script>
  </body>
</html>
